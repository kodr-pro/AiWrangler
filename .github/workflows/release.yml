name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache a release build

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles 10.x.
      - name: npm CLI for trusted publishing
        run: npm install -g npm@11

      - name: Require the tag to match package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Skip publish if this version is already on npm
        run: |
          set -euo pipefail
          if npm view "@kodr/aiwrangler@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "@kodr/aiwrangler@${GITHUB_REF_NAME#v} is already published; skipping publish (bootstrap or re-tag)"
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
          fi

      # No token: the CLI authenticates with the GitHub Actions OIDC identity
      # configured as this package's trusted publisher on npmjs.com.
      # Provenance attestations are generated automatically in this mode.
      - name: Publish
        if: env.SKIP_PUBLISH != '1'
        run: npm publish --access public

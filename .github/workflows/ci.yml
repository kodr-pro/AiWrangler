name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # verify:p5 scans `git log main`. A pull request checkout is not that ref,
      # and a command-line fetch does not always update origin/main.
      # verify:p1 scans HEAD instead, so the PR's own commits are included.
      - name: Fetch main for history scans
        run: |
          if [ "$(git rev-parse --abbrev-ref HEAD)" = "main" ]; then
            git fetch origin main
          else
            git fetch origin main:refs/heads/main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Pack tarball and launch bins via npx
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball="$(echo "$RUNNER_TEMP"/aiwrangler-*.tgz)"
          work="$RUNNER_TEMP/pack-install"
          mkdir -p "$work"
          (cd "$work" && npm init -y >/dev/null && npm install "$tarball")
          if [ -d "$work/node_modules/@opencode-ai/plugin" ]; then
            echo "optional peer @opencode-ai/plugin was installed with the tarball" >&2
            exit 1
          fi
          help="$(npm exec --prefix "$work" -- aiwrangler --help)"
          printf '%s\n' "$help" | grep -q "aiwrangler ack"
          node --input-type=module -e '
            import { spawn } from "node:child_process"
            const bin = process.argv[1]
            const child = spawn(bin, [], { stdio: ["pipe", "pipe", "pipe"] })
            let err = ""
            const timer = setTimeout(() => {
              child.kill("SIGTERM")
              console.error("timed out waiting for aiwrangler-mcp\\n" + err)
              process.exit(1)
            }, 15000)
            child.stderr.on("data", (buf) => {
              err += buf.toString()
              if (err.includes("aiwrangler-mcp: ready")) {
                clearTimeout(timer)
                child.kill("SIGTERM")
              }
            })
            child.on("exit", () => {
              if (!err.includes("aiwrangler-mcp: ready")) {
                console.error(err)
                process.exit(1)
              }
              process.exit(0)
            })
          ' "$work/node_modules/.bin/aiwrangler-mcp"
          # Same invocation a fresh shell uses: npx -y <pkg> for each bin.
          empty="$RUNNER_TEMP/npx-empty"
          mkdir -p "$empty"
          (cd "$empty" && npx -y --package "$tarball" aiwrangler --help) | grep -q "aiwrangler ack"
          node --input-type=module -e '
            import { spawn } from "node:child_process"
            const tarball = process.argv[1]
            const cwd = process.argv[2]
            const child = spawn("npx", ["-y", "--package", tarball, "aiwrangler-mcp"], {
              cwd,
              stdio: ["pipe", "pipe", "pipe"],
            })
            let err = ""
            const timer = setTimeout(() => {
              child.kill("SIGTERM")
              console.error("timed out waiting for npx aiwrangler-mcp\\n" + err)
              process.exit(1)
            }, 60000)
            child.stderr.on("data", (buf) => {
              err += buf.toString()
              if (err.includes("aiwrangler-mcp: ready")) {
                clearTimeout(timer)
                child.kill("SIGTERM")
              }
            })
            child.on("exit", () => {
              if (!err.includes("aiwrangler-mcp: ready")) {
                console.error(err)
                process.exit(1)
              }
              process.exit(0)
            })
          ' "$tarball" "$empty"

      # Exits non-zero if seeded recall drops below 1 or any false positive
      # appears. Informational today: keep the log, do not fail the job.
      - name: verify:p5 (informational)
        run: npm run verify:p5
        continue-on-error: true
